# ============================================================
# Owlsgo-Chat — Nginx 站点完整配置（随程序走，不依赖 phpstudy 面板）
# ============================================================
# ★ 为什么有这个文件：
#   phpstudy 面板每次修改站点 / 切换 PHP 版本都会整文件重写 conf/vhosts/*.conf，
#   且重写时曾出现「含空格路径丢失英文双引号」的缺陷（Nginx 起不来 → 全站 502）。
#   本文件由 nginx.conf 直接 include，面板怎么重写 vhost 都不影响本配置。
#
# ★ 接入方式（已在 nginx.conf 里完成，一次性）：
#   http 块中注释掉  include vhosts/*.conf;
#   改为            include "D:/Program Files (x86)/phpstudy_pro/WWW/Owlsgo-Chat/nginx-server.conf";
#
# ★ 切换 PHP 版本时：
#   若面板更换 PHP 后出现 502，把下方 fastcgi_pass 端口改成实际 php-cgi 监听端口。
#   本机当前：9001（phpstudy 站点所选 PHP 8.2.9 的 php-cgi 池）。
#   参考常见映射：9000→php7.3 | 9001→php8.0.2 | 9002→php8.2.9（以本机实际监听为准）。
#
# ★ 长轮询须知（本项目实时通道是 AJAX 长轮询，不是 WebSocket）：
#   1) 服务端 poll 最长挂起 20 秒，故 fastcgi_read_timeout 必须 > 20s（此处 65s）。
#   2) fastcgi_buffering off：响应即时下发，不被代理缓冲拖住。
#   3) php-cgi 进程数：每个挂起的 poll 会占住一个 php-cgi 进程，
#      请在 phpstudy 面板把 PHP 的进程数调到 5 个以上（默认 2 个会排队）。
#
# ★ 部署到其他环境：修改 root 与 fastcgi_pass 即可。
# ============================================================

server {
    listen        80;
    listen        443 ssl;
    server_name   localhost;

    ssl_certificate      "D:/Program Files (x86)/phpstudy_pro/Extensions/Nginx1.16.1/conf/ssl/localhost.pem";
    ssl_certificate_key  "D:/Program Files (x86)/phpstudy_pro/Extensions/Nginx1.16.1/conf/ssl/localhost.key";
    ssl_session_timeout  5m;
    ssl_protocols        TLSv1.1 TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    root   "D:/Program Files (x86)/phpstudy_pro/WWW/Owlsgo-Chat";
    index  index.php index.html;

    # 图片/贴纸上传（服务端兜底 10MB，留余量）
    client_max_body_size 20m;

    # ★ 目录保护（Nginx 侧兜底，纵深防御）：
    #   data/   存 SQLite 库与安装锁；core/、plugins/ 是程序代码，一律禁止外部访问
    #   uploads/ 允许静态访问，但禁止执行 PHP
    location ~ ^/(data|core|plugins)/ {
        deny all;
        return 403;
    }
    location ~* ^/uploads/.*\.php$ {
        deny all;
        return 403;
    }

    # 静态资源缓存 7 天
    location ~* \.(css|js|svg|png|jpe?g|webp|gif|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        # 全部请求统一入口：index.php（?page= 页面 / ?action= API）
        try_files $uri $uri/ /index.php?$query_string;
        autoindex off;
    }

    location ~ \.php(.*)$ {
        fastcgi_pass        127.0.0.1:9001;
        fastcgi_index       index.php;
        fastcgi_split_path_info  ^((?U).+\.php)(/?.+)$;
        fastcgi_param  SCRIPT_FILENAME    $document_root$fastcgi_script_name;
        fastcgi_param  PATH_INFO          $fastcgi_path_info;
        fastcgi_param  PATH_TRANSLATED    $document_root$fastcgi_path_info;
        include        fastcgi_params;

        # 长轮询专用：放宽超时 + 关闭缓冲（详见文件头说明）
        fastcgi_connect_timeout 10s;
        fastcgi_send_timeout    65s;
        fastcgi_read_timeout    65s;
        fastcgi_buffering       off;
    }

    # 禁止隐藏文件（.git 等）
    location ~ /\. {
        deny all;
    }
}
